<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek Kit preview</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.55 system-ui, sans-serif; background: #fff; color: #1f2328; }
  body.dark { background: #16181a; color: #e6e8ea; }
  #out { height: 100%; }
  #out.pad { padding: 16px; overflow: auto; box-sizing: border-box; }
  #out iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  #out img.svg { max-width: 100%; height: auto; }
  #out pre { overflow: auto; padding: 10px; border-radius: 6px; background: rgba(127,127,127,.14); }
  #out code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  #out table { border-collapse: collapse; } #out td, #out th { border: 1px solid rgba(127,127,127,.4); padding: 4px 8px; }
  #out blockquote { margin: 0; padding-left: 12px; border-left: 3px solid rgba(127,127,127,.5); }
  .err { color: #c62828; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  body.dark .err { color: #ff8a8a; }
</style>
</head>
<body>
<div id="out" class="pad"></div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="preview.js"></script>
</body>
</html>
